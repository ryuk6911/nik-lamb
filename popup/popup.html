<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nik-lamb</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <span class="popup-logo">⚡</span>
      <h1 class="popup-title">Nik-lamb</h1>
    </header>

    <div class="popup-status" id="popup-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking...</span>
    </div>

    <div class="popup-info">
      <div class="info-row">
        <span class="info-label">Current Bid</span>
        <span class="info-value" id="current-bid">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Next Bid</span>
        <span class="info-value" id="next-bid">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Bids Placed</span>
        <span class="info-value" id="bid-count">0</span>
      </div>
      <div class="info-row">
        <span class="info-label">Max Limit</span>
        <span class="info-value" id="max-limit">∞</span>
      </div>
    </div>

    <div class="popup-controls">
      <button id="btn-arm" class="popup-btn btn-arm">⚡ ARM</button>
      <button id="btn-disarm" class="popup-btn btn-disarm" style="display:none;">🛑 DISARM</button>
      <button id="btn-lock" class="popup-btn btn-lock">🔒 LOCK BID</button>
    </div>

    <div class="popup-max-bid">
      <label for="max-bid-input">Max Bid Limit (₹):</label>
      <input type="number" id="max-bid-input" placeholder="No limit">
      <button id="btn-set-limit" class="popup-btn btn-small">Set</button>
    </div>

    <!-- Authenticator Modal for Popup -->
    <div class="popup-auth-modal" id="popup-auth-modal" style="display:none;">
      <div class="popup-auth-card">
        <div class="popup-auth-title">🔐 Authenticator Code</div>
        <p class="popup-auth-hint">Enter 6-digit code to LOCK BID</p>
        <input type="text" id="popup-auth-input" maxlength="6" inputmode="numeric" placeholder="••••••" autocomplete="off" />
        <div id="popup-auth-error" class="popup-auth-error"></div>
        <div class="popup-auth-actions">
          <button id="popup-auth-submit" class="popup-btn btn-arm">Verify & Lock</button>
          <button id="popup-auth-cancel" class="popup-btn btn-small">Cancel</button>
        </div>
      </div>
    </div>

    <div class="popup-footer">
      <p id="config-status">⚙️ Open target page → use overlay to configure.</p>
    </div>
  </div>
  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
